<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Гастрономический Небоскрёб</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1a24;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 800px;
      background: linear-gradient(180deg, #16192b 0%, #2b1e3a 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    /* Верхнее табло */
    .hud {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 30;
      pointer-events: none;
    }
    .score-badge {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 800;
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, 0.3);
    }
    .best-badge {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      color: #06d6a0;
      border: 1px solid rgba(6, 214, 160, 0.3);
      display: flex;
      align-items: center;
    }

    /* Холст игры */
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Подсказка снизу */
    .tap-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 0.5px;
      pointer-events: none;
      animation: pulse 1.8s infinite;
      z-index: 20;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    /* Экран проигрыша */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 25, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 25px;
      text-align: center;
    }
    .modal.active { display: flex; }
    .modal h2 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #ef476f;
      text-shadow: 0 4px 15px rgba(239, 71, 111, 0.4);
    }
    .dish-summary {
      font-size: 16px;
      color: #adb5bd;
      margin-bottom: 25px;
    }
    .final-score {
      font-size: 48px;
      font-weight: 900;
      color: #ffd166;
      margin-bottom: 25px;
    }
    .restart-btn {
      background: #06d6a0;
      color: #073b4c;
      font-size: 18px;
      font-weight: 800;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(6, 214, 160, 0.4);
      transition: transform 0.1s;
    }
    .restart-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div class="score-badge">Этаж: <span id="score">0</span></div>
    <div class="best-badge">Рекорд: <span id="best">0</span></div>
  </div>

  <canvas id="stage"></canvas>

  <div class="tap-hint" id="hint">Тапай по экрану, чтобы ставить этаж!</div>

  <div class="modal" id="game-over">
    <h2>Башня рухнула!</h2>
    <div class="dish-summary" id="last-dish-msg">Мясо по-французски соскользнуло...</div>
    <div class="final-score" id="final-score">0</div>
    <button class="restart-btn" id="restart-btn">Построить заново</button>
  </div>
</div>

<script>
  // Инициализация Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  function triggerHaptic(type) {
    if (!tg?.HapticFeedback) return;
    if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
    if (type === 'perfect') tg.HapticFeedback.notificationOccurred('success');
    if (type === 'miss') tg.HapticFeedback.notificationOccurred('error');
  }

  // Простой синтезатор звуков
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, type = 'sine', duration = 0.1) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  // Меню гастрономических «этажей»
  const DISHES = [
    { name: "Мясо по-французски", icon: "🥩", color: "#b0413e" },
    { name: "Оливье с горошком", icon: "🥗", color: "#588157" },
    { name: "Селёдка под шубой", icon: "🐟", color: "#9b2226" },
    { name: "Бутерброды со шпротами", icon: "🥪", color: "#d4a373" },
    { name: "Заливное из языка", icon: "🍲", color: "#3a86ff" },
    { name: "Сырная тарелка", icon: "🧀", color: "#ffb703" },
    { name: "Крабовый салат", icon: "🦀", color: "#fb8500" },
    { name: "Мясная нарезка", icon: "🥓", color: "#c1121f" },
    { name: "Маринованные грибочки", icon: "🍄", color: "#606c38" },
    { name: "Холодец с хреном", icon: "🧆", color: "#6c584c" },
    { name: "Фаршированные перцы", icon: "🫑", color: "#e63946" },
    { name: "Фисташковое ассорти", icon: "🥜", color: "#70e000" } // Секретный этаж
  ];

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = canvas.width = rect.width;
    height = canvas.height = rect.height;
  }
  window.addEventListener('resize', resize);
  resize();

  // Параметры игры
  const BLOCK_HEIGHT = 44;
  let stack = [];
  let debrisList = [];
  let currentBlock = null;
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('tower_best') || '0', 10);
  let isGameOver = false;
  let cameraY = 0;
  let targetCameraY = 0;

  document.getElementById('best').textContent = bestScore;

  function initGame() {
    score = 0;
    isGameOver = false;
    debrisList = [];
    cameraY = 0;
    targetCameraY = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('game-over').classList.remove('active');
    document.getElementById('hint').style.display = 'block';

    const baseWidth = Math.min(width * 0.72, 260);
    const baseX = (width - baseWidth) / 2;
    const baseY = height - BLOCK_HEIGHT - 60;

    // Стол-основание
    stack = [
      {
        x: baseX,
        y: baseY,
        w: baseWidth,
        dish: { name: "Праздничный стол", icon: "🍽️", color: "#495057" }
      }
    ];

    spawnNextBlock();
  }

  function spawnNextBlock() {
    const prev = stack[stack.length - 1];
    const dish = DISHES[Math.floor(Math.random() * DISHES.length)];
    const speed = 3.5 + Math.min(score * 0.15, 6.5);
    const dir = Math.random() < 0.5 ? 1 : -1;

    currentBlock = {
      x: dir === 1 ? -prev.w : width,
      y: prev.y - BLOCK_HEIGHT,
      w: prev.w,
      dish: dish,
      dir: dir,
      speed: speed
    };

    targetCameraY = Math.max(0, (stack.length - 4) * BLOCK_HEIGHT);
  }

  function placeBlock() {
    if (isGameOver || !currentBlock) return;
    document.getElementById('hint').style.display = 'none';

    const prev = stack[stack.length - 1];
    const diff = currentBlock.x - prev.x;
    const tolerance = 4; // погрешность на идеальное попадание

    // Полный промах
    if (Math.abs(diff) >= currentBlock.w) {
      gameOver();
      return;
    }

    let newWidth = currentBlock.w - Math.abs(diff);
    let newX = diff > 0 ? currentBlock.x : prev.x;

    // Идеальная посадка блока (Бонус)
    if (Math.abs(diff) <= tolerance) {
      newX = prev.x;
      newWidth = prev.w;
      playBeep(880 + score * 30, 'sine', 0.2);
      triggerHaptic('perfect');
    } else {
      // Срезаем выступающий кусок (падающий обрезок)
      const debrisW = Math.abs(diff);
      const debrisX = diff > 0 ? newX + newWidth : currentBlock.x;
      debrisList.push({
        x: debrisX,
        y: currentBlock.y,
        w: debrisW,
        color: currentBlock.dish.color,
        vy: 2,
        rot: 0,
        vrot: (diff > 0 ? 0.05 : -0.05)
      });

      playBeep(440 + score * 25, 'triangle', 0.12);
      triggerHaptic('impact');
    }

    stack.push({
      x: newX,
      y: currentBlock.y,
      w: newWidth,
      dish: currentBlock.dish
    });

    score++;
    document.getElementById('score').textContent = score;

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('tower_best', bestScore);
      document.getElementById('best').textContent = bestScore;
    }

    spawnNextBlock();
  }

  function gameOver() {
    isGameOver = true;
    triggerHaptic('miss');
    playBeep(180, 'sawtooth', 0.35);

    // Падение последнего промахнувшегося куска
    debrisList.push({
      x: currentBlock.x,
      y: currentBlock.y,
      w: currentBlock.w,
      color: currentBlock.dish.color,
      vy: 4,
      rot: 0,
      vrot: currentBlock.dir * 0.08
    });
    currentBlock = null;

    setTimeout(() => {
      document.getElementById('last-dish-msg').textContent = 
        `Блюдо соскользнуло с вершины башни!`;
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over').classList.add('active');
    }, 600);
  }

  // Обработчики кликов и тапов
  function handleInput(e) {
    if (e.target.id === 'restart-btn') return;
    placeBlock();
  }
  window.addEventListener('pointerdown', handleInput);
  document.getElementById('restart-btn').addEventListener('click', initGame);

  // Игровой цикл
  function loop() {
    // Плавное следование камеры за высотой
    cameraY += (targetCameraY - cameraY) * 0.1;

    // Движение летающего блока
    if (currentBlock && !isGameOver) {
      currentBlock.x += currentBlock.dir * currentBlock.speed;
      if (currentBlock.dir === 1 && currentBlock.x > width - currentBlock.w + 40) {
        currentBlock.dir = -1;
      } else if (currentBlock.dir === -1 && currentBlock.x < -40) {
        currentBlock.dir = 1;
      }
    }

    // Физика падающих обрезков
    for (let i = debrisList.length - 1; i >= 0; i--) {
      const d = debrisList[i];
      d.y += d.vy;
      d.vy += 0.5;
      d.rot += d.vrot;
      if (d.y - cameraY > height + 100) debrisList.splice(i, 1);
    }

    // Отрисовка
    ctx.clearRect(0, 0, width, height);

    ctx.save();
    ctx.translate(0, cameraY);

    // Рисуем уже стоящие блоки башни
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      drawBlock(b.x, b.y, b.w, BLOCK_HEIGHT, b.dish);
    }

    // Рисуем текущий движущийся блок
    if (currentBlock) {
      drawBlock(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT, currentBlock.dish);
    }

    // Рисуем падающие куски
    for (let d of debrisList) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, d.y + BLOCK_HEIGHT / 2);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.w / 2, -BLOCK_HEIGHT / 2, d.w, BLOCK_HEIGHT);
      ctx.restore();
    }

    ctx.restore();

    requestAnimationFrame(loop);
  }

  // Отрисовка блюда с эффектом объема и иконкой
  function drawBlock(x, y, w, h, dish) {
    ctx.save();

    // Тень под блоком
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fillRect(x + 2, y + 4, w, h);

    // Тело блюда
    ctx.fillStyle = dish.color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h - 3, 8);
    ctx.fill();

    // Верхний светлый блик (эффект глазури / сыра)
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    ctx.fillRect(x + 4, y + 2, Math.max(0, w - 8), 4);

    // Нижняя кромка (объем)
    ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
    ctx.fillRect(x, y + h - 7, w, 4);

    // Название и иконка блюда
    if (w > 50) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const label = w > 130 ? `${dish.icon} ${dish.dish || dish.name}` : dish.icon;
      ctx.fillText(label, x + w / 2, y + (h - 3) / 2);
    }

    ctx.restore();
  }

  initGame();
  loop();
</script>
</body>
</html>
